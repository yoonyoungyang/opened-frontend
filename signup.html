<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>회원가입 | 아무 말 대잔치</title>

    <link rel="stylesheet" href="./css/signup.css" />
  </head>

  <body>
    <header class="header">
      <div class="header-inner">
        <button
          type="button"
          class="back-button"
          aria-label="로그인 페이지로 돌아가기"
        >
          ‹
        </button>

        <h1 class="header-title">아무 말 대잔치</h1>
      </div>
    </header>

    <main class="main">
      <section class="signup-section">
        <h2 class="signup-title">회원가입</h2>

        <form class="signup-form">
          <div class="profile-group">
            <span class="form-label">
              프로필 사진<span aria-hidden="true">*</span>
            </span>

            <p class="profile-helper-text"></p>

            <label
              for="profile-image"
              class="profile-image-label"
              aria-label="프로필 사진 선택"
            >
              <span class="profile-image-preview">
                <span class="plus-icon"></span>
              </span>
            </label>

            <input
              type="file"
              id="profile-image"
              name="profileImage"
              class="visually-hidden"
              accept=".png,.jpg,.jpeg,image/png,image/jpeg"
            />
          </div>

          <div class="form-group">
            <label for="email" class="form-label">
              이메일<span aria-hidden="true">*</span>
            </label>

            <input
              type="email"
              id="email"
              name="email"
              class="form-input"
              placeholder="이메일을 입력하세요"
              autocomplete="email"
            />

            <p class="helper-text"></p>
          </div>

          <div class="form-group">
            <label for="password" class="form-label">
              비밀번호<span aria-hidden="true">*</span>
            </label>

            <input
              type="password"
              id="password"
              name="password"
              class="form-input"
              placeholder="비밀번호를 입력하세요"
              autocomplete="new-password"
            />

            <p class="helper-text"></p>
          </div>

          <div class="form-group">
            <label for="password-confirm" class="form-label">
              비밀번호 확인<span aria-hidden="true">*</span>
            </label>

            <input
              type="password"
              id="password-confirm"
              name="passwordConfirm"
              class="form-input"
              placeholder="비밀번호를 한번 더 입력하세요"
              autocomplete="new-password"
            />

            <p class="helper-text"></p>
          </div>

          <div class="form-group nickname-group">
            <label for="nickname" class="form-label">
              닉네임<span aria-hidden="true">*</span>
            </label>

            <input
              type="text"
              id="nickname"
              name="nickname"
              class="form-input"
              placeholder="닉네임을 입력하세요"
              maxlength="10"
            />

            <p class="helper-text"></p>
          </div>

          <button type="submit" class="signup-button" disabled>회원가입</button>

          <a href="./login.html" class="login-link"> 로그인하러 가기 </a>
        </form>
      </section>
    </main>
  </body>
</html>
