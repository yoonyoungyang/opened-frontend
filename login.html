<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>로그인 | 아무 말 대잔치</title>

    <link rel="stylesheet" href="./css/login.css" />
  </head>

  <body>
    <header class="header">
      <h1 class="header-title">아무 말 대잔치</h1>
    </header>

    <main class="main">
      <section class="login-section">
        <h2 class="login-title">로그인</h2>

        <form class="login-form">
          <div class="input-group">
            <label for="email" class="input-label"> 이메일 </label>

            <input
              type="email"
              id="email"
              name="email"
              class="input-field"
              placeholder="이메일을 입력하세요"
              autocomplete="email"
            />

            <p class="helper-text" id="email-helper"></p>
          </div>

          <div class="input-group">
            <label for="password" class="input-label"> 비밀번호 </label>

            <input
              type="password"
              id="password"
              name="password"
              class="input-field"
              placeholder="비밀번호를 입력하세요"
              autocomplete="current-password"
            />

            <p class="helper-text" id="password-helper"></p>
          </div>

          <button type="submit" class="login-button" disabled>로그인</button>
        </form>

        <a href="./signup.html" class="signup-link"> 회원가입 </a>
      </section>
    </main>

    <script src="./js/login.js"></script>
  </body>
</html>
