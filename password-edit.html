<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>비밀번호 수정 | 아무 말 대잔치</title>

    <link rel="stylesheet" href="./css/password-edit.css" />
  </head>

  <body>
    <header class="header">
      <div class="header-inner">
        <h1 class="header-title">아무 말 대잔치</h1>

        <button type="button" class="profile-button" aria-label="프로필 메뉴">
          <span class="profile-image"></span>
        </button>
      </div>
    </header>

    <main class="main">
      <section class="password-edit-section">
        <h2 class="page-title">비밀번호 수정</h2>

        <form class="password-edit-form">
          <div class="form-group">
            <label for="password" class="form-label"> 비밀번호 </label>

            <input
              type="password"
              id="password"
              name="password"
              class="form-input"
              placeholder="비밀번호를 입력하세요"
              autocomplete="new-password"
            />

            <p class="helper-text"></p>
          </div>

          <div class="form-group">
            <label for="password-confirm" class="form-label">
              비밀번호 확인
            </label>

            <input
              type="password"
              id="password-confirm"
              name="passwordConfirm"
              class="form-input"
              placeholder="비밀번호를 한번 더 입력하세요"
              autocomplete="new-password"
            />

            <p class="helper-text"></p>
          </div>

          <button type="submit" class="edit-button" disabled>수정하기</button>
        </form>
      </section>
    </main>

    <div class="toast-message hidden">수정 완료</div>
  </body>
</html>
