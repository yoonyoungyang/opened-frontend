<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>게시글 작성 | 아무 말 대잔치</title>

    <link rel="stylesheet" href="../css/pages/post-form.css" />
  </head>

  <body>
    <div
      data-header
      data-back="true"
      data-back-label="게시글 목록으로 돌아가기"
      data-profile="button"
    ></div>

    <main class="main">
      <section class="create-section">
        <h2 class="create-title">게시글 작성</h2>

        <form class="create-form">
          <div class="form-group">
            <label for="post-title" class="form-label">
              제목<span aria-hidden="true">*</span>
            </label>

            <input
              type="text"
              id="post-title"
              name="title"
              class="title-input"
              placeholder="제목을 입력해주세요. (최대 26글자)"
              maxlength="26"
            />
          </div>

          <div class="form-group content-group">
            <label for="post-content" class="form-label">
              내용<span aria-hidden="true">*</span>
            </label>

            <textarea
              id="post-content"
              name="content"
              class="content-input"
              placeholder="내용을 입력해주세요."
            ></textarea>

            <p class="helper-text"></p>
          </div>

          <div class="form-group image-group">
            <span class="form-label">이미지</span>

            <div class="file-area">
              <label for="post-image" class="file-button"> 파일 선택 </label>

              <input
                type="file"
                id="post-image"
                name="image"
                class="file-input"
                accept=".png,.jpg,.jpeg,image/png,image/jpeg"
              />

              <span class="file-name"> 파일을 선택해주세요. </span>
            </div>
          </div>

          <button type="submit" class="submit-button" disabled>완료</button>
        </form>
      </section>
    </main>
    <script type="module" src="../js/pages/post-create.js"></script>
  </body>
</html>
