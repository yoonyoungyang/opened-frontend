<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>게시글 목록 | 아무 말 대잔치</title>

    <link rel="stylesheet" href="../css/pages/posts.css" />
  </head>

  <body>
    <header class="header">
      <div class="header-inner">
        <h1 class="header-title">아무 말 대잔치</h1>

        <button type="button" class="profile-button" aria-label="프로필 메뉴">
          <span class="profile-image"></span>
        </button>
      </div>
    </header>

    <main class="main">
      <section class="board-section">
        <div class="board-introduction">
          <p>
            안녕하세요,<br />
            아무 말 대잔치 게시판 입니다.
          </p>
        </div>

        <div class="write-button-wrapper">
          <button type="button" class="write-button">게시글 작성</button>
        </div>

        <div class="post-list"></div>
      </section>
    </main>
    <script type="module" src="../js/pages/posts.js"></script>
  </body>
</html>
