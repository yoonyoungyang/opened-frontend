<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>게시글 목록 | 아무 말 대잔치</title>

    <link rel="stylesheet" href="../css/pages/posts.css" />
  </head>

  <body>
    <div data-header data-profile="menu"></div>

    <main class="main">
      <section class="board-section">
        <div class="board-introduction">
          <p>인기 특별관 예매 정보를 가장 빠르게 나눠보세요.</p>
        </div>

        <section class="cinema-ui-filter" aria-label="게시글 필터">
          <div class="cinema-ui-filter-heading">
            <h2>게시글 찾기</h2>
            <button type="button" class="cinema-ui-filter-reset">초기화</button>
          </div>

          <div class="cinema-ui-filter-controls">
            <label class="cinema-ui-filter-field">
              <span>상영관</span>
              <select class="cinema-ui-filter-select">
                <option>전체 상영관</option>
                <option>용산 아이파크몰 IMAX</option>
                <option>왕십리 IMAX</option>
                <option>여의도 4DX</option>
                <option>코엑스 Dolby Cinema</option>
                <option>월드타워 수퍼플렉스</option>
              </select>
            </label>

            <label class="cinema-ui-filter-field">
              <span>영화명</span>
              <input
                type="search"
                class="cinema-ui-filter-input"
                placeholder="영화명을 입력하세요"
              />
            </label>

            <label class="cinema-ui-filter-field">
              <span>게시글 유형</span>
              <select class="cinema-ui-filter-select">
                <option>전체 유형</option>
                <option>예매 오픈</option>
                <option>취소표</option>
                <option>좌석 후기</option>
                <option>질문</option>
              </select>
            </label>

            <button type="button" class="cinema-ui-filter-submit">확인</button>
          </div>
        </section>

        <div class="write-button-wrapper">
          <button type="button" class="write-button">게시글 작성</button>
        </div>

        <h2 class="cinema-ui-post-list-title">게시글 목록</h2>

        <div class="post-list"></div>
      </section>
    </main>
    <script type="module" src="../js/components/header.js"></script>
    <script type="module" src="../js/pages/posts.js"></script>
  </body>
</html>
