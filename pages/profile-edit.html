<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>회원정보 수정 | 아무 말 대잔치</title>

    <link rel="stylesheet" href="../css/pages/profile-edit.css" />
  </head>

  <body>
    <div data-header data-profile="menu"></div>

    <main class="main">
      <section class="profile-edit-section">
        <h2 class="page-title">회원정보수정</h2>

        <form class="profile-edit-form">
          <div class="profile-image-group">
            <span class="form-label profile-label">
              프로필 사진<span aria-hidden="true">*</span>
            </span>

            <label for="profile-image-input" class="profile-image-label">
              <img
                src="../assets/default-profile.png"
                alt="현재 프로필 이미지"
                class="profile-image-preview"
                id="profile-image-preview"
              />

              <span class="profile-image-overlay">변경</span>
            </label>

            <input
              type="file"
              id="profile-image-input"
              name="profileImage"
              class="visually-hidden"
              accept=".png,.jpg,.jpeg,image/png,image/jpeg"
            />
          </div>

          <div class="form-group">
            <span class="form-label">이메일</span>

            <p class="email-value">startupcode@gmail.com</p>
          </div>

          <div class="form-group nickname-group">
            <label for="nickname" class="form-label">닉네임</label>

            <input
              type="text"
              id="nickname"
              name="nickname"
              class="nickname-input"
              value="스타트업코드"
              maxlength="10"
            />

            <p class="helper-text"></p>
          </div>

          <button type="submit" class="edit-button">수정하기</button>

          <button type="button" class="withdraw-button">회원 탈퇴</button>
        </form>
      </section>
    </main>

    <div class="modal-overlay hidden">
      <section
        class="confirm-modal"
        role="dialog"
        aria-modal="true"
        aria-labelledby="withdraw-modal-title"
        aria-describedby="withdraw-modal-description"
      >
        <h2 id="withdraw-modal-title" class="confirm-modal-title">
          회원탈퇴 하시겠습니까?
        </h2>

        <p id="withdraw-modal-description" class="confirm-modal-description">
          작성된 게시글과 댓글은 삭제됩니다.
        </p>

        <div class="confirm-modal-buttons">
          <button type="button" class="modal-button cancel-button">취소</button>

          <button type="button" class="modal-button confirm-button">
            확인
          </button>
        </div>
      </section>
    </div>

    <div class="toast-message" hidden>수정완료</div>

    <script type="module" src="../js/components/header.js"></script>
    <script type="module" src="../js/pages/profile-edit.js"></script>
  </body>
</html>
