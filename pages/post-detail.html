<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>게시글 상세 | 아무 말 대잔치</title>

    <link rel="stylesheet" href="../css/pages/post-detail.css" />
  </head>

  <body>
    <div
      data-header
      data-back="true"
      data-back-label="게시글 목록으로 돌아가기"
      data-profile="button"
    ></div>

    <main class="main">
      <section class="post-error" aria-live="polite" hidden>
        <p class="post-error-message">게시글을 불러오지 못했어요.</p>

        <button type="button" class="retry-button">다시 시도</button>
      </section>

      <article class="post" hidden>
        <header class="post-header">
          <h2 class="post-title"></h2>

          <div class="post-header-bottom">
            <div class="post-author-information">
              <span class="author-image"></span>

              <span class="author-name"></span>

              <time class="post-date"></time>
            </div>

            <div class="post-buttons">
              <button type="button" class="small-button post-edit-button">
                수정
              </button>

              <button type="button" class="small-button post-delete-button">
                삭제
              </button>
            </div>
          </div>
        </header>

        <section class="post-body">
          <div class="post-image" aria-label="게시글 이미지 영역"></div>

          <p class="post-text"></p>
        </section>

        <section class="post-statistics" aria-label="게시글 통계">
          <button type="button" class="statistic-button">
            <strong id="like-count">0</strong>
            <span>좋아요수</span>
          </button>

          <div class="statistic-box">
            <strong id="view-count">0</strong>
            <span>조회수</span>
          </div>

          <div class="statistic-box">
            <strong id="comment-count">0</strong>
            <span>댓글</span>
          </div>
        </section>
      </article>

      <section class="comment-section" hidden>
        <form class="comment-form">
          <textarea
            class="comment-input"
            name="comment"
            placeholder="댓글을 남겨주세요!"
          ></textarea>

          <div class="comment-submit-area">
            <button type="submit" class="comment-submit-button" disabled>
              댓글 등록
            </button>
          </div>
        </form>

        <div class="comment-list"></div>
      </section>
    </main>

    <!-- 게시글 삭제와 댓글 삭제에 공통으로 사용하는 모달 -->
    <div class="modal-overlay" hidden>
      <section
        class="delete-modal"
        role="dialog"
        aria-modal="true"
        aria-labelledby="delete-modal-title"
        aria-describedby="delete-modal-description"
      >
        <h2 id="delete-modal-title" class="delete-modal-title">
          게시글을 삭제하시겠습니까?
        </h2>

        <p id="delete-modal-description" class="delete-modal-description">
          삭제한 내용은 복구 할 수 없습니다.
        </p>

        <div class="delete-modal-buttons">
          <button type="button" class="modal-button cancel-button">취소</button>

          <button type="button" class="modal-button confirm-button">
            확인
          </button>
        </div>
      </section>
    </div>

    <script type="module" src="../js/pages/post-detail.js"></script>
  </body>
</html>
