<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>로그인 필요 | 열렸나요</title>

    <link rel="stylesheet" href="../css/pages/post-form.css" />
  </head>

  <body>
    <div
      data-header
      data-back="true"
      data-back-label="이전 페이지로 돌아가기"
      data-profile="menu"
    ></div>

    <main class="main">
      <section class="post-error" aria-live="polite" hidden>
        <p class="post-error-message">사용자 권한이 없습니다.</p>

        <button type="button" class="retry-button">돌아가기</button>
      </section>

      <section class="edit-section">
        <h2 class="edit-title">게시글 수정</h2>

        <form class="edit-form">
          <div class="cinema-ui-post-settings">
            <div class="cinema-ui-setting-group">
              <span class="form-label">게시글 유형</span>
              <div class="cinema-ui-type-options">
                <label>
                  <input
                    type="radio"
                    name="cinemaPostType"
                    value="OPEN"
                    checked
                  />
                  <span>예매 오픈</span>
                </label>
                <label>
                  <input type="radio" name="cinemaPostType" value="CANCEL" />
                  <span>취소표</span>
                </label>
                <label>
                  <input type="radio" name="cinemaPostType" value="SEAT" />
                  <span>좌석 후기</span>
                </label>
                <label>
                  <input type="radio" name="cinemaPostType" value="QUESTION" />
                  <span>질문</span>
                </label>
              </div>
            </div>

            <div class="cinema-ui-setting-row">
              <label class="cinema-ui-setting-field">
                <span class="form-label">상영관</span>
                <select>
                  <option>상영관을 선택하세요</option>
                  <option>용산 아이파크몰 IMAX</option>
                  <option>왕십리 IMAX</option>
                  <option>여의도 4DX</option>
                  <option>코엑스 Dolby Cinema</option>
                  <option>월드타워 수퍼플렉스</option>
                </select>
              </label>

              <label class="cinema-ui-setting-field">
                <span class="form-label">영화명</span>
                <input type="text" placeholder="영화명을 입력하세요" />
              </label>
            </div>

            <div class="cinema-ui-extra-fields cinema-ui-extra-open">
              <label>
                <span>오픈된 상영 시작일</span>
                <input type="date" />
              </label>
              <label>
                <span>오픈된 상영 종료일</span>
                <input type="date" />
              </label>
            </div>

            <div class="cinema-ui-extra-fields cinema-ui-extra-cancel">
              <label>
                <span>상영 일시</span>
                <input type="datetime-local" />
              </label>
              <label>
                <span>좌석 정보</span>
                <input type="text" placeholder="예: G열 12번" />
              </label>
            </div>

            <div class="cinema-ui-extra-fields cinema-ui-extra-seat">
              <label>
                <span>좌석 정보</span>
                <input type="text" placeholder="예: F열 중앙" />
              </label>
              <label>
                <span>시야 만족도</span>
                <select>
                  <option>★★★★★</option>
                  <option>★★★★☆</option>
                  <option>★★★☆☆</option>
                  <option>★★☆☆☆</option>
                  <option>★☆☆☆☆</option>
                </select>
              </label>
            </div>
          </div>

          <div class="form-group">
            <label for="post-title" class="form-label">
              제목<span aria-hidden="true">*</span>
            </label>

            <input
              type="text"
              id="post-title"
              name="title"
              class="title-input"
              value="제목 1"
              maxlength="26"
            />
          </div>

          <div class="form-group content-group">
            <label for="post-content" class="form-label">
              내용<span aria-hidden="true">*</span>
            </label>

            <textarea id="post-content" name="content" class="content-input">
무엇을 얘기할까요? 아무말이라면, 삶은 항상 놀라운 모험이라고 생각합니다. 우리는 매일 새로운 경험을 하고 배우며 성장합니다. 때로는 어려움과 도전이 있지만, 그것들이 우리를 더 강하고 지혜롭게 만듭니다. 또한 우리는 주변의 사람들과 연결되며 사랑과 지지를 받습니다. 그래서 우리의 삶은 소중하고 의미가 있습니다.
자연도 아름다운 이야기입니다. 우리 주변의 자연은 끝없는 아름다움과 신비로움을 담고 있습니다. 산, 바다, 숲, 하늘 등 모든 것이 우리를 놀라게 만들고 감동시킵니다. 자연은 우리의 생명과 안정을 지키며 우리에게 힘을 주는 곳입니다.
마지막으로, 지식을 향한 탐구는 항상 흥미로운 여정입니다. 우리는 끝없는 지식의 바다에서 배우고 발견할 수 있으며, 이것이 우리를 더 깊이 이해하고 세상을 더 넓게 보게 해줍니다. 그런 의미에서, 삶은 놀라움과 경이로움으로 가득 차 있습니다. 새로운 경험을 즐기고 항상 앞으로 나아가는 것이 중요하다고 생각합니다.</textarea
            >

            <p class="helper-text">*helper text</p>
          </div>

          <div class="form-group">
            <span class="form-label">이미지</span>

            <div class="file-area">
              <label for="post-image" class="file-button"> 파일 선택 </label>

              <input
                type="file"
                id="post-image"
                name="image"
                class="file-input"
                accept=".png,.jpg,.jpeg,image/png,image/jpeg"
              />

              <span class="file-name"> 기존 파일 명 </span>
            </div>
          </div>

          <button type="submit" class="submit-button">수정하기</button>
        </form>
      </section>
    </main>
    <script type="module" src="../js/components/header.js"></script>
    <script type="module" src="../js/pages/post-edit.js"></script>
  </body>
</html>
